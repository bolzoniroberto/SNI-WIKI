services:
  postgres:
    image: postgres:16
    container_name: sni_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sni
      POSTGRES_PASSWORD: sni
      POSTGRES_DB: sniwiki
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sni -d sniwiki"]
      interval: 5s
      timeout: 5s
      retries: 10

  chromadb:
    image: chromadb/chroma:latest
    container_name: sni_chromadb
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - chromadata:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"

volumes:
  pgdata:
  chromadata:
